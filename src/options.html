<!doctype html>
<html>
    <head>
        <meta charset="UTF-8" />
        <title>RedHeader — All rules</title>
        <link rel="stylesheet" href="popup.css" />
        <link rel="stylesheet" href="options.css" />
    </head>
    <body>
        <h1>All rules</h1>

        <form id="rule-form">
            <label>
                URL filter
                <input
                    type="text"
                    id="urlFilter"
                    placeholder="* (all URLs) or e.g. *://api.example.com/*"
                />
            </label>

            <label>
                Operation
                <select id="operation">
                    <option value="set">Set / Add</option>
                    <option value="remove">Remove</option>
                </select>
            </label>

            <label>
                Header name
                <input
                    type="text"
                    id="headerName"
                    placeholder="e.g. Authorization"
                    required
                />
            </label>

            <label id="headerValueLabel">
                Header value
                <input
                    type="text"
                    id="headerValue"
                    placeholder="e.g. Bearer my-token"
                />
            </label>
            <input type="hidden" id="headerId" />
            <button type="submit" id="submitbtn">Add rule</button>
            <button type="button" id="cancelBtn" hidden="true">Cancel</button>
        </form>

        <ul id="rule-list"></ul>
        <div id="pagination" class="pagination" hidden>
            <button type="button" id="prevPageBtn">Prev</button>
            <span id="pageIndicator"></span>
            <button type="button" id="nextPageBtn">Next</button>
        </div>
        <script src="options.js"></script>
    </body>
</html>
